# Place this file at your PORTFOLIO ROOT: D:\portfolio\netlify.toml

[build]
  publish = "."

[[headers]]
  for = "/project11/_next/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
git push